frr version 8.0
hostname us-east-1
service integrated-vtysh-config

interface eth1
 ip address 10.10.10.1/31
 description US AWS DXGW

interface eth2
 ip address 10.10.10.23/31
 description AWS Full Mesh - us-west-2

interface eth3
 ip address 10.10.10.51/31
 description AWS Full Mesh - ap-northeast-1

ip route 10.100.0.0/16 Null0

router bgp 65101
 neighbor 10.10.10.0 remote-as 65100
 neighbor 10.10.10.22 remote-as 65102
 neighbor 10.10.10.50 remote-as 65103

 ! allow everything
 neighbor 10.10.10.0 route-map ALLOW-ALL in
 neighbor 10.10.10.0 route-map ALLOW-ALL out
 neighbor 10.10.10.22 route-map ALLOW-ALL in
 neighbor 10.10.10.22 route-map ALLOW-ALL out
 neighbor 10.10.10.50 route-map ALLOW-ALL in
 neighbor 10.10.10.50 route-map ALLOW-ALL out

 network 10.100.0.0/16

route-map ALLOW-ALL permit 10