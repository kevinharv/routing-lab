frr version 8.0
hostname hub1
service integrated-vtysh-config

interface eth1
 ip address 10.10.10.5/31
 description US AWS DXGW

interface eth2
 ip address 10.10.10.20/31
 description Hub 2 DCI

ip route 10.60.0.0/16 Null0

router bgp 65052
 neighbor 10.10.10.4 remote-as 65100
 neighbor 10.10.10.21 remote-as 65051

 ! allow everything
 neighbor 10.10.10.4 route-map ALLOW-ALL in
 neighbor 10.10.10.4 route-map ALLOW-ALL out
 neighbor 10.10.10.21 route-map ALLOW-ALL in
 neighbor 10.10.10.21 route-map ALLOW-ALL out

 network 10.60.0.0/16

route-map ALLOW-ALL permit 10