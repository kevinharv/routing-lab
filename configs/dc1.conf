frr version 8.0
hostname dc1
service integrated-vtysh-config

interface eth1
 ip address 10.10.10.30/31
 description DCI - Hub 1

interface eth2
 ip address 10.10.10.32/31
 description DCI - Hub 2

ip route 10.70.0.0/16 Null0

router bgp 65061
 neighbor 10.10.10.31 remote-as 65052
 neighbor 10.10.10.33 remote-as 65051

 ! allow everything
 neighbor 10.10.10.31 route-map ALLOW-ALL in
 neighbor 10.10.10.31 route-map ALLOW-ALL out
 neighbor 10.10.10.33 route-map ALLOW-ALL in
 neighbor 10.10.10.33 route-map ALLOW-ALL out

 network 10.70.0.0/16

route-map ALLOW-ALL permit 10