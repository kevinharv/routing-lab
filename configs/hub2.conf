frr version 8.0
hostname hub2
service integrated-vtysh-config

interface eth1
 ip address 10.10.10.7/31
 description US AWS DXGW

interface eth2
 ip address 10.10.10.21/31
 description Hub 1 DCI

ip route 10.50.0.0/16 Null0

router bgp 65051
 neighbor 10.10.10.6 remote-as 65100
 neighbor 10.10.10.20 remote-as 65052

 ! allow everything (fixes your policy issue)
 neighbor 10.10.10.6 route-map ALLOW-ALL in
 neighbor 10.10.10.6 route-map ALLOW-ALL out
 neighbor 10.10.10.20 route-map ALLOW-ALL in
 neighbor 10.10.10.20 route-map ALLOW-ALL out

 network 10.50.0.0/16

route-map ALLOW-ALL permit 10