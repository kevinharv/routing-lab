frr version 8.0
hostname ap-northeast-1
service integrated-vtysh-config

interface eth1
 ip address 10.10.10.50/31
 description AWS Full Mesh - us-east-1

interface eth2
 ip address 10.10.10.52/31
 description AWS Full Mesh - us-west-2

ip route 10.140.0.0/16 Null0

router bgp 65103
 neighbor 10.10.10.51 remote-as 65101
 neighbor 10.10.10.53 remote-as 65102

 ! allow everything
 neighbor 10.10.10.51 route-map ALLOW-ALL in
 neighbor 10.10.10.51 route-map ALLOW-ALL out
 neighbor 10.10.10.53 route-map ALLOW-ALL in
 neighbor 10.10.10.53 route-map ALLOW-ALL out

 network 10.140.0.0/16

route-map ALLOW-ALL permit 10