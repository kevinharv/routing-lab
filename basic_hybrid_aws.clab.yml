name: enterprise-hybrid-cloud

topology:
  nodes:
    us-dxgw:
     kind: linux
     image: frrouting/frr:latest
     binds:
      - configs/daemons:/etc/frr/daemons
      - configs/us-dxgw.conf:/etc/frr/frr.conf 

    us-east-1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs//daemons:/etc/frr/daemons
        - configs/us-east-1.conf:/etc/frr/frr.conf
    
    us-west-2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/us-west-2.conf:/etc/frr/frr.conf

    hub1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/hub1.conf:/etc/frr/frr.conf

    hub2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/hub2.conf:/etc/frr/frr.conf

  links:
    - endpoints: ["us-dxgw:eth1", "us-east-1:eth1"]
    - endpoints: ["us-dxgw:eth2", "us-west-2:eth1"]
    - endpoints: ["us-dxgw:eth3", "hub1:eth1"]
    - endpoints: ["us-dxgw:eth4", "hub2:eth1"]
    - endpoints: ["hub1:eth2", "hub2:eth2"]             # Data center interconnect
    - endpoints: ["us-east-1:eth2", "us-west-2:eth2"]   # AWS Full Mesh - us-east-1/us-west-2
