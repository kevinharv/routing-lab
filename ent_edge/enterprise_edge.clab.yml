name: enterprise-edge

topology:
  nodes:
    dev-dxgw:
     kind: linux
     image: frrouting/frr:latest
     binds:
      - configs/daemons:/etc/frr/daemons
      - configs/aws/dev-dxgw.conf:/etc/frr/frr.conf 

    b2b-er:
     kind: linux
     image: frrouting/frr:latest
     binds:
      - configs/daemons:/etc/frr/daemons
      - configs/other/dev-b2b.conf:/etc/frr/frr.conf 

    h1edgesw1a:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/dc/h1edgesw1a.conf:/etc/frr/frr.conf
        - configs/dc/h1edgesw1a-startup.sh:/usr/local/bin/vrf-init.sh
      exec:
        - /usr/local/bin/vrf-init.sh

    h1edgengfw:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/dc/h1edgengfw.conf:/etc/frr/frr.conf
        - configs/dc/h1edgengfw-startup.sh:/usr/local/bin/vrf-init.sh
      exec:
        - /usr/local/bin/vrf-init.sh

  links:
    # AWS Direct Connect Links
    - endpoints: ["dev-dxgw:eth1", "h1edgesw1a:eth1"]
    
    # B2B Links
    - endpoints: ["b2b-er:eth1", "h1edgesw1a:eth2"]

    # NGFW Links
    - endpoints: ["h1edgengfw:eth1", "h1edgesw1a:eth3"] # AWS-DEV VRF
    - endpoints: ["h1edgengfw:eth2", "h1edgesw1a:eth4"] # B2B-DEV VRF
