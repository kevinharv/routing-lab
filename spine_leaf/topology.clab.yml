---
name: dc-spine-leaf

topology:
  nodes:
    spine1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/__clabNodeName__.conf:/etc/frr/frr.conf
    spine2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/__clabNodeName__.conf:/etc/frr/frr.conf

    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/__clabNodeName__.conf:/etc/frr/frr.conf
      exec:
        - ip link add br10 type bridge
        - ip link set br10 up
        - ip link add vxlan10010 type vxlan id 10010 local 10.255.255.1 dstport 4789 nolearning
        - ip link set vxlan10010 master br10
        - ip link set vxlan10010 up
    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/__clabNodeName__.conf:/etc/frr/frr.conf
      exec:
        - ip link add br10 type bridge
        - ip link set br10 up
        - ip link add vxlan10010 type vxlan id 10010 local 10.255.255.2 dstport 4789 nolearning
        - ip link set vxlan10010 master br10
        - ip link set vxlan10010 up
    leaf3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/__clabNodeName__.conf:/etc/frr/frr.conf
      exec:
        - ip link add br10 type bridge
        - ip link set br10 up
        - ip link add vxlan10010 type vxlan id 10010 local 10.255.255.3 dstport 4789 nolearning
        - ip link set vxlan10010 master br10
        - ip link set vxlan10010 up

    client1:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.11/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 192.168.10.1
    client2:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.12/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 192.168.10.1
    client3:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - ip addr add 192.168.10.13/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 192.168.10.1

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]
    - endpoints: ["leaf3:eth1", "spine1:eth3"]
    - endpoints: ["leaf3:eth2", "spine2:eth3"]
    - endpoints: ["client1:eth1", "leaf1:eth3"]
    - endpoints: ["client2:eth1", "leaf2:eth3"]
    - endpoints: ["client3:eth1", "leaf3:eth3"]